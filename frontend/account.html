<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Account — Mien</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#0f172a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Mien" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" href="/icons/icon-192.png" />
<script src="/js/theme.js"></script>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/index.html" class="brand"><span class="brand-mark"></span>Mien</a>
    <div class="nav-links">
      <a href="/scan.html">Scan</a>
      <a href="/history.html">History</a>
      <a href="/journal.html">Journal</a>
      <a href="/account.html">Account</a>
    </div>
    <div class="nav-actions" id="nav-actions"></div>
  </div>
</nav>

<main class="wrap" style="padding:44px 24px 96px;">
  <div style="max-width:560px; margin:0 auto;">
    <h1 style="font-size:28px;">Your account</h1>
    <div class="panel" style="padding:24px; margin:22px 0;">
      <div class="muted" style="font-size:12.5px;">Name</div>
      <div id="acc-name" style="font-family:var(--font-display); font-size:19px; margin-bottom:14px;">…</div>
      <div class="muted" style="font-size:12.5px;">Email</div>
      <div id="acc-email" style="font-size:15px;">…</div>
    </div>

    <div class="panel" style="padding:24px;">
      <h2 style="font-size:18px; margin-bottom:6px;">Change password</h2>
      <p style="font-size:13.5px; margin-bottom:18px;">If the admin gave you a temporary password, enter it as the current password.</p>
      <div class="form-error" id="form-error"></div>
      <div class="form-success" id="form-success" style="display:none;">Password changed.</div>
      <form id="pw-form">
        <div class="field"><label for="cur">Current password</label><input type="password" id="cur" autocomplete="current-password" required /></div>
        <div class="field"><label for="new1">New password (8+ characters)</label><input type="password" id="new1" autocomplete="new-password" minlength="8" required /></div>
        <div class="field"><label for="new2">Repeat new password</label><input type="password" id="new2" autocomplete="new-password" minlength="8" required /></div>
        <button type="submit" class="btn btn-primary" id="pw-btn">Update password</button>
      </form>
    </div>

    <div class="row gap-12" style="margin-top:22px;">
      <button class="btn btn-ghost" id="acc-logout">Log out</button>
    </div>
  </div>
</main>

<footer class="site-footer">
  <p class="footer-copyright">&copy; 2026 Facial Analyzer | Developed by <span class="footer-dev">Fairuj Nower</span></p>
</footer>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
(async function () {
  let me;
  try { me = (await Api.me()).user; } catch (_) { window.location.href = '/login.html?next=dashboard'; return; }
  document.getElementById('acc-name').textContent = me.name;
  document.getElementById('acc-email').textContent = me.email;

  const form = document.getElementById('pw-form');
  const err = document.getElementById('form-error');
  const ok = document.getElementById('form-success');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.classList.remove('visible'); ok.style.display = 'none';
    if (document.getElementById('new1').value !== document.getElementById('new2').value) {
      err.textContent = 'The two new passwords do not match.'; err.classList.add('visible'); return;
    }
    const btn = document.getElementById('pw-btn'); btn.disabled = true;
    try {
      await Api.changePassword({ currentPassword: document.getElementById('cur').value, newPassword: document.getElementById('new1').value });
      ok.style.display = 'block'; form.reset();
    } catch (e2) {
      err.textContent = e2.message; err.classList.add('visible');
    }
    btn.disabled = false;
  });
  document.getElementById('acc-logout').addEventListener('click', async () => { await Api.logout(); window.location.href = '/index.html'; });
})();
</script>
</body>
</html>
