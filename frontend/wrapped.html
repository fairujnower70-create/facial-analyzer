<main class="wrap" style="padding:44px 24px 96px;">
  <div style="max-width:560px; margin:0 auto;">
    <div class="center" style="margin-bottom:22px;">
      <h1 style="font-size:28px;">Mien Wrapped</h1>
      <p>Your month, on your face.</p>
    </div>

    <div class="row gap-12" style="justify-content:center; margin-bottom:22px; flex-wrap:wrap;" id="period-tabs">
      <button class="btn btn-ghost mode-tab" data-p="week">This week</button>
      <button class="btn btn-ghost mode-tab active" data-p="month">This month</button>
      <button class="btn btn-ghost mode-tab" data-p="last">Last month</button>
    </div>

    <div id="loading" class="skeleton-stack"><div class="skeleton sk-card"></div><div class="skeleton sk-card"></div></div>
    <div id="empty" class="panel center" style="display:none; padding:34px 24px;">
      <p id="empty-msg" style="margin-bottom:16px;">No saved scans in this period yet.</p>
      <a href="/scan.html" class="btn btn-primary">Run a scan</a>
    </div>

    <div id="wrapped-body" style="display:none;">
      <div id="wrapped-canvas-wrap" class="wrapped-canvas-wrap"></div>
      <div class="row gap-12" style="justify-content:center; margin-top:18px;">
        <button class="btn btn-primary" id="wrapped-share">Share card</button>
      </div>
      <p id="wrapped-note" class="field-hint center" style="margin-top:12px;"></p>
    </div>
  </div>
</main>
