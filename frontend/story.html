<main class="wrap ms-wrap">
  <header class="ms-head">
    <div>
      <p class="ms-eyebrow">Mood Story</p>
      <h1 class="ms-title" id="ms-title">Your month</h1>
      <p class="muted" id="ms-sub" style="margin:6px 0 0;">Your face, in numbers.</p>
    </div>
    <div class="seg" id="period-tabs" role="tablist">
      <button type="button" data-p="week">Week</button>
      <button type="button" data-p="month" class="on">This month</button>
      <button type="button" data-p="last">Last month</button>
    </div>
  </header>

  <div id="loading" class="skeleton-stack"><div class="skeleton sk-card"></div><div class="skeleton sk-card"></div></div>
  <div id="empty" class="panel center" style="display:none; padding:34px 24px;">
    <p id="empty-msg" style="margin-bottom:16px;">No saved scans in this period yet.</p>
    <a href="/scan.html" class="btn btn-primary">Run a scan</a>
  </div>

  <div id="ms-body" style="display:none;">
    <div class="bento" id="bento"></div>
    <div class="row gap-12" style="justify-content:center; margin-top:26px; flex-wrap:wrap;">
      <button class="btn btn-primary" id="story-share">Share this month as a card</button>
    </div>
    <p id="story-note" class="field-hint center" style="margin-top:12px;"></p>
  </div>
