<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Log in — Mien</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#0f172a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Mien" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" href="/icons/icon-192.png" />
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/index.html" class="brand"><span class="brand-mark"></span>Mien</a>
    <div class="nav-links"></div>
    <div class="nav-actions" id="nav-actions"></div>
  </div>
</nav>

<div class="auth-shell">
  <div class="panel auth-card">
    <h1>Welcome back</h1>
    <p style="margin-bottom:26px;">Log in to run a scan or check your history.</p>

    <div class="form-error" id="form-error"></div>

    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
        <span id="submit-label">Log in</span>
      </button>
    </form>

    <div class="auth-switch">New to Mien? <a href="/signup.html">Create an account</a></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
  const form = document.getElementById('login-form');
  const errorBox = document.getElementById('form-error');
  const submitBtn = document.getElementById('submit-btn');
  const submitLabel = document.getElementById('submit-label');

  const NEXT_PAGES = { scan: '/scan.html', history: '/history.html', admin: '/admin.html', dashboard: '/dashboard.html' };
  function nextDestination() {
    const key = new URLSearchParams(window.location.search).get('next');
    return NEXT_PAGES[key] || '/dashboard.html';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('visible');
    submitBtn.disabled = true;
    submitLabel.innerHTML = '<span class="neon-ring-loader sm"></span>';

    const payload = { email: form.email.value.trim(), password: form.password.value };

    try {
      await Api.login(payload);
      window.location.href = nextDestination();
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add('visible');
      submitBtn.disabled = false;
      submitLabel.textContent = 'Log in';
    }
  });
</script>

<footer class="site-footer">
  <p class="footer-copyright">&copy; 2026 Facial Analyzer | Developed by <span class="footer-dev">Fairuj Nower</span></p>
</footer>
</body>
</html>
